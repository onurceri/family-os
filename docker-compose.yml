# FamilyOS — `docker compose up -d`, then open the address the log prints (http://localhost:3000/setup?code=…)
# Update: `docker compose pull && docker compose up -d`. To build from source instead:
# `docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build`
services:
  famos:
    # The released image (amd64 and arm64). Set FAMOS_VERSION to stay on a version, e.g. 0.1 or 0.1.0.
    image: ghcr.io/onurceri/familyos:${FAMOS_VERSION:-latest}
    ports:
      - "3000:3000"
    volumes:
      - famos-data:/data
    environment:
      # Public URL of this instance. Must be HTTPS for installing the PWA / Share Target on phones.
      FAMOS_BASE_URL: ${FAMOS_BASE_URL:-http://localhost:3000}
      TZ: ${TZ:-UTC}
      # Optional: FAMOS_SECRET (generated and stored in the volume if unset), FAMOS_BACKUP_HOUR, LOG_LEVEL
      # Optional: an AI provider kept in line with these on every start (or add one in More → AI):
      # FAMOS_AI_PROVIDER: openrouter          # or ollama (with the profile below: FAMOS_AI_BASE_URL=http://ollama:11434/v1)
      # FAMOS_AI_API_KEY: sk-or-...
      # FAMOS_AI_MODEL: google/gemini-2.5-flash
    restart: unless-stopped

  # Optional local AI: `docker compose --profile ollama up -d`
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  famos-data:
  ollama-data:
