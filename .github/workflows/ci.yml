name: CI

# Runs for pull requests, by hand, from the release workflows, and after a merge to main. The run
# on main is what lets a new pull request start from warm caches: a pull request can read caches
# saved on its base branch, but never those of another pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflows run the same checks before publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Privacy-first project: no tool telemetry from CI.
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # The Turborepo cache is carried between runs with actions/cache; entries nobody has written for
  # a week are dropped so it does not grow without end.
  TURBO_CACHE_MAX_AGE: 7d

# Every job starts at once; none waits for another. `ci-ok` is the one check to require.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup

      - name: Generated code is up to date (OpenAPI, public OpenAPI, API client, extension API types)
        run: |
          pnpm gen
          changed=$(git status --porcelain --untracked-files=all -- apps/server/openapi.json apps/server/public-openapi.json packages/api-client/src/generated 'extensions/*/openapi.json' 'extensions/*/src/web/api.gen.d.ts')
          if [ -n "$changed" ]; then echo "$changed"; git diff --stat; exit 1; fi

      - run: pnpm lint

  # Split in three because type checking is CPU-bound: every extension is two TypeScript programs
  # (server and web) that each load the shared packages again, and a runner has four cores.
  # Turborepo's cache skips the packages a change does not reach. A new extension falls in the
  # first part, so none goes unchecked.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: extensions-1
            filter: >-
              '--filter=./extensions/*' '--filter=!./extensions/inbox' '--filter=!./extensions/kitchen'
              '--filter=!./extensions/lists' '--filter=!./extensions/pets' '--filter=!./extensions/records'
              '--filter=!./extensions/vehicles'
          - part: extensions-2
            filter: >-
              --filter=./extensions/inbox --filter=./extensions/kitchen --filter=./extensions/lists
              --filter=./extensions/pets --filter=./extensions/records --filter=./extensions/vehicles
          - part: apps-and-packages
            filter: "'--filter=!./extensions/*'"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      # Turborepo keys every task on its own inputs (sources, lockfile, task definition), so a
      # restored cache from an older commit only ever replays results whose inputs still match.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-typecheck-${{ matrix.part }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-${{ matrix.part }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-typecheck-${{ matrix.part }}-
      - run: pnpm exec turbo run typecheck ${{ matrix.filter }}

  # Vitest is not run through Turborepo (one root run over all projects), so it is split by files.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: SvelteKit's generated types for the web app's tests
        run: pnpm --filter @famos/web gen
      - run: pnpm test --shard=${{ matrix.shard }}/3

  # Each shard builds the production bundle itself (a cache hit when nothing changed), which also
  # proves `pnpm build` works.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The browser and its system libraries come with the image, so no apt step waits on a slow
    # Ubuntu mirror. Its version must match @playwright/test in apps/e2e (scripts/ci-playwright.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-build-${{ matrix.shard }}-
      - run: pnpm build

      - run: pnpm --filter @famos/e2e exec playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/e2e/playwright-report
          retention-days: 7

  # A pull request proves the image still builds, and main keeps the layer cache warm for the next
  # one; a release builds and publishes the image itself.
  docker:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The arm64 half builds under emulation; a hung build would otherwise hold the PR for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build multi-arch image (amd64, arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The single check for branch protection: green only when every job above passed (docker may be
  # skipped outside pull requests and main).
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
