name: Release

# Push a tag made by `pnpm release <x.y.z>` (docs/releasing.md). The checks run first; then the
# multi-arch image goes to GitHub Container Registry and a GitHub release gets generated notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # ghcr.io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # tags and history for the release notes
          persist-credentials: false

      - name: The tag matches the product version
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual="$(node -p "require('./apps/server/package.json').version")"
          test "$version" = "$actual" || { echo "Tag $GITHUB_REF_NAME but apps/server is $actual"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Nothing is published before the extension signing key is known to work: a wrong secret
      # would otherwise fail only after the image and `latest` are out. Installing runs
      # dependency code, so the key is set on the check step alone. A pre-release publishes no
      # packages and needs no key.
      - if: ${{ !contains(github.ref_name, '-') }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: ${{ !contains(github.ref_name, '-') }}
        run: pnpm install --frozen-lockfile
      - if: ${{ !contains(github.ref_name, '-') }}
        name: The extension signing key is one the server trusts
        env:
          FAMOS_EXTENSION_SIGNING_KEY: ${{ secrets.FAMOS_EXTENSION_SIGNING_KEY }}
        run: node scripts/extension-key.mjs check --key-env FAMOS_EXTENSION_SIGNING_KEY

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/familyos
          # 1.2.3, 1.2, 1 and latest; pre-releases (1.2.3-rc.1) get only their own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release with notes from the commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "FamilyOS $VERSION" --notes-file notes.md $prerelease

  # The extension packages the image ships, released with the product's version: attached to the
  # release and added to the signed index servers look in (Settings → Extensions → Look for
  # more). A pre-release publishes none: a package version has no pre-release part.
  extensions:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-extensions.yml
    with:
      tag: ${{ github.ref_name }}
      title: FamilyOS ${{ github.ref_name }}
    secrets:
      FAMOS_EXTENSION_SIGNING_KEY: ${{ secrets.FAMOS_EXTENSION_SIGNING_KEY }}
