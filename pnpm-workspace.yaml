packages:
  - apps/*
  - packages/*
  - extensions/*

# Versions shared by five or more packages, pinned once. Packages say `catalog:`.
catalog:
  '@lucide/svelte': 1.52.0
  kysely: 0.29.6
  svelte: 5.57.1
  svelte-check: 4.7.6
  typescript: 6.0.3
  zod: 4.6.6

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7.13 declares typescript ^5 but works with TS 6 (verified by `pnpm gen`).
    openapi-typescript>typescript: '6'

overrides:
  # The AI SDK's provider-utils accepts undici ^7.29, which includes versions with a denial-of-service flaw (fixed in 7.30.1).
  undici: 7.30.1
