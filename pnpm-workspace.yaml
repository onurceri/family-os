packages:
  - apps/*
  - packages/*
  - extensions/*

# Versions shared by five or more packages, pinned once. Packages say `catalog:`.
catalog:
  '@lucide/svelte': 1.52.0
  kysely: 0.29.6
  svelte: 5.57.1
  svelte-check: 4.7.6
  typescript: 6.0.3
  zod: 4.6.6

allowBuilds:
  # core-js's install script only prints a funding notice.
  core-js: false
  esbuild: true

peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7.13 declares typescript ^5 but works with TS 6 (verified by `pnpm gen`).
    openapi-typescript>typescript: '6'

overrides:
  # The AI SDK's provider-utils accepts undici ^7.29, which includes versions with a denial-of-service flaw (fixed in 7.30.1).
  undici: 7.30.1
  # imapflow > socks accepts ip-address ^10.1.1, which includes versions with a quadratic-time parsing flaw (fixed in 10.7.4).
  ip-address: 10.7.6

auditConfig:
  ignoreGhsas:
    # picomatch's slow matching of crafted glob patterns: no fixed version exists yet. It comes only with
    # vite and vitest, which build and test the app; the image holds neither, and no glob pattern reaches
    # them from outside. Remove this line once a fixed picomatch is released.
    - GHSA-fc5q-39xc-vjpf
