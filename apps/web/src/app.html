<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#171717" />
		<link rel="icon" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<title>FamilyOS</title>
		<script>
			// Apply night before the first paint so the page never flashes the day palette: this
			// device's choice (lib/theme.svelte.ts), else the system setting.
			try {
				const mode = localStorage.getItem('famos.mode');
				if (mode === 'night' || (mode !== 'day' && matchMedia('(prefers-color-scheme: dark)').matches))
					document.documentElement.classList.add('dark');
			} catch {
				if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
			}
			// Apply the last theme this device used before the first paint as well.
			try {
				const theme = JSON.parse(localStorage.getItem('famos.theme') || 'null');
				if (theme && typeof theme.css === 'string') {
					const style = document.createElement('style');
					style.id = 'famos-theme';
					style.textContent = theme.css;
					document.head.appendChild(style);
				}
			} catch {}
			// And the last style, so a styled app never draws in the default's type first.
			try {
				const style = localStorage.getItem('famos.style');
				document.documentElement.dataset.style = style && /^[a-z][a-z0-9-]{1,39}$/.test(style) ? style : 'broadsheet';
			} catch {
				document.documentElement.dataset.style = 'broadsheet';
			}
		</script>
		<style>
			/* The same quiet mark as lib/LoadingMark.svelte, for the time before the app has loaded:
			   invisible for the first 800 ms, so a fast start never flashes it. It uses the theme's
			   tokens once they exist and the default palette until then; the app removes it when it
			   takes over (LoadingMark.svelte). */
			#boot-mark {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				pointer-events: none;
				opacity: 0;
				animation: boot-in 240ms ease-out 800ms forwards;
			}
			#boot-mark span {
				width: 24px;
				height: 24px;
				border-radius: 50%;
				border: 2px solid var(--line, #d6d3ca);
				border-top-color: var(--ink-soft, #65625a);
				animation: boot-spin 900ms linear infinite;
			}
			.dark #boot-mark span {
				border-color: var(--line, #34353a);
				border-top-color: var(--ink-soft, #9a978f);
			}
			@keyframes boot-in {
				to {
					opacity: 1;
				}
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot-mark span {
					animation: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-mark" aria-hidden="true"><span></span></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
